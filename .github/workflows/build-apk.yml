name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع النسخة المراد بناؤها (Build Variant)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'debug'
          - 'release'

jobs:
  build-apk:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Configure google-services.json (Optional Secret)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON from GitHub Secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          else
            echo "Using default repository google-services.json"
          fi

      - name: 🔐 Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: 📋 Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🚀 Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == null }}
        run: |
          mkdir -p /tmp/build_logs
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build_logs/debug_build.log || (echo "=== GRADLE ERROR ===" && tail -n 100 /tmp/build_logs/debug_build.log && exit 1)

      - name: 🚀 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == null }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build_logs/release_build.log || (echo "=== GRADLE ERROR ===" && tail -n 100 /tmp/build_logs/release_build.log && exit 1)

      - name: 📦 Prepare APK Artifacts
        if: always()
        run: |
          mkdir -p output-apks
          
          # Copy all generated APKs
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output-apks/ \; || true

          # Copy logs if any
          if [ -d "/tmp/build_logs" ]; then
            cp /tmp/build_logs/*.log output-apks/ || true
          fi

          echo "Generated Artifacts list:"
          ls -la output-apks/

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hararah-Village-APK
          path: output-apks/*
          retention-days: 30

      - name: 🏷️ Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
