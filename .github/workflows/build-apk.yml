name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع النسخة المراد بناؤها (Build Variant)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'debug'
          - 'release'

jobs:
  build-apk:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Configure google-services.json (Optional Secret)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON from GitHub Secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          else
            echo "Using default repository google-services.json"
          fi

      - name: 📁 Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json css js images pages android/app/src/main/assets/

      - name: 🔐 Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: 📋 Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🚀 Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == null }}
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: 🚀 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == null }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --stacktrace

      - name: 📦 Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          
          # Copy Debug APK
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apks/Hararah-Village-Debug.apk
          fi

          # Copy Release APK
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output-apks/Hararah-Village-Release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apks/Hararah-Village-Release-unsigned.apk
          fi

          # Verify APK exists
          if [ $(find output-apks -name "*.apk" | wc -l) -eq 0 ]; then
            echo "❌ Error: No APK files were generated!"
            exit 1
          fi

          echo "✅ Generated APKs successfully:"
          ls -lh output-apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hararah-Village-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
